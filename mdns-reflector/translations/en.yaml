configuration:
  interfaces:
    name: Interfaces
    description: >-
      Host network interfaces to reflect mDNS between, such as end0, end0.20
      and end0.30. At least two are required, and each must already exist on
      the host.
  reflect_filters:
    name: Reflect filters
    description: >-
      Service types allowed to cross between VLANs, for example
      _hap._tcp.local. Leave empty to reflect every service type. This host's
      own announcements are never reflected either way.
  reflect_ipv6:
    name: Reflect over IPv6
    description: Also reflect mDNS traffic over IPv6.
  reflect_between_ipv4_ipv6:
    name: Bridge IPv4 and IPv6
    description: >-
      Forward mDNS traffic between IPv4 and IPv6. Leave off unless you know
      you need it.
  disallow_other_stacks:
    name: Disallow other mDNS stacks
    description: >-
      Stop Avahi from sharing UDP port 5353 with other responders. Leave off,
      or Avahi will conflict with Home Assistant's own zeroconf stack.
  allow_point_to_point:
    name: Allow point-to-point interfaces
    description: Include PPP and VPN style interfaces when reflecting.
  log_level:
    name: Log level
    description: >-
      Set to debug to log the generated Avahi configuration and run the daemon
      with verbose output.
  exclude_sources:
    name: Excluded source addresses
    description: >-
      IP addresses whose mDNS is dropped before the reflector sees it. Use for
      a machine on two reflected VLANs at once, such as a docked laptop, and
      list both of its addresses. These hosts also become invisible to Home
      Assistant's own discovery.
  exclude_mode:
    name: Exclusion mode
    description: >-
      advertisements drops only the excluded hosts' mDNS responses, so they
      still discover services across VLANs themselves - use this to AirPlay
      from a dual-homed Mac. all drops every mDNS packet from them.
  exclude_names:
    name: Excluded names
    description: >-
      Fixed substrings (not regular expressions) matched against mDNS packet
      contents, to exclude a host by name rather than by address. Substrings
      over-match easily, so prefer a specific name you have verified.
  mode:
    name: Mode
    description: >-
      reflector relays multicast between VLANs with Avahi. proxy learns
      services on the proxy sources and answers for them on the proxy targets,
      like a switch's service-discovery gateway - use it when your Wi-Fi never
      delivers multicast to clients.
  proxy_sources:
    name: Proxy sources
    description: >-
      Proxy mode only. Interfaces to learn services on, such as the VLAN your
      printers live on. Must not overlap with the proxy targets.
  proxy_targets:
    name: Proxy targets
    description: >-
      Proxy mode only. Interfaces to publish the learned services on, such as
      your Wi-Fi client VLAN.
  proxy_services:
    name: Proxied services
    description: >-
      Proxy mode only. Full service types to learn and republish, for example
      _ipp._tcp.local. for printers.
  proxy_subtypes:
    name: Proxied subtypes
    description: >-
      Proxy mode only. Subtypes to learn and republish for every service.
      _universal is what iPhones and iPads browse for AirPrint.
