---
# https://developers.home-assistant.io/docs/add-ons/configuration#add-on-config
name: mDNS Reflector
version: "1.0.0"
slug: mdns_reflector
description: >-
  Reflect mDNS/Bonjour between VLAN interfaces with Avahi, so HomeKit,
  AirPlay and ONVIF discovery work across network segments.
url: "https://github.com/jeanders/ha-mdns-reflector/tree/main/mdns-reflector"
# Uncomment after the first GitHub release has published images. Until then
# this stays commented so the add-on builds locally on the host.
# image: "ghcr.io/jeanders/mdns-reflector"
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto

# The reflector must see the host's real VLAN interfaces (end0, end0.20,
# end0.30) rather than a private container network.
host_network: true
privileged:
  - NET_ADMIN
  - NET_RAW

options:
  interfaces:
    - end0
    - end0.20
    - end0.30
  # Empty = reflect every service type. The default below covers the common
  # cross-VLAN cases, including AirPlay.
  #
  # It still omits Apple's peer-to-peer and identity services (_companion-link,
  # _rdlink, _device-info, _sleep-proxy), which carry no discovery value across
  # VLANs and are a conflict source for machines sitting on two reflected VLANs
  # at once. AirPlay is a conflict source too, but it is usually the reason
  # people run a reflector, so it stays in: pair it with exclude_sources for any
  # dual-homed machine. See DOCS.md.
  #
  # Avahi never reflects the host's own announcements (see
  # originates_from_local_iface in avahi-core/server.c), so Home Assistant's and
  # Scrypted's own services are excluded automatically.
  reflect_filters:
    - _airplay._tcp.local
    - _raop._tcp.local
    - _hap._tcp.local
    - _hap._udp.local
    - _matter._tcp.local
    - _matterc._udp.local
    - _esphomelib._tcp.local
    - _googlecast._tcp.local
    - _spotify-connect._tcp.local
    - _ipp._tcp.local
    - _ipps._tcp.local
    - _printer._tcp.local
    - _pdl-datastream._tcp.local
  # Hosts whose mDNS is dropped before Avahi sees it, by source IP. Use this for
  # a machine that is on two reflected VLANs at once (a docked laptop on wired
  # VLAN A and Wi-Fi VLAN B): list BOTH of its addresses. See DOCS.md - this
  # installs firewall rules on the host.
  exclude_sources: []
  # Substrings matched against the raw mDNS packet, for excluding hosts by name
  # rather than by address - useful when DHCP moves them around. Fixed strings,
  # not regular expressions: the kernel's string match has no regex support.
  # Empty by default deliberately; see DOCS.md for why "MacBook" is not a safe
  # default.
  exclude_names: []
  # What to drop for those hosts:
  #   advertisements - only their mDNS responses, so they still cannot be
  #                    reflected, but their queries still cross and they keep
  #                    discovering everything else (needed to AirPlay OUT).
  #   all            - every mDNS packet from them, including queries.
  exclude_mode: advertisements
  reflect_ipv6: false
  reflect_between_ipv4_ipv6: false
  disallow_other_stacks: false
  allow_point_to_point: false
  log_level: info

schema:
  # Host interfaces to reflect between. At least two, or there is nothing to do.
  interfaces:
    - str
  # Service types allowed to cross. Empty list = reflect everything.
  reflect_filters:
    - str
  # Source IPs whose mDNS never reaches the reflector.
  exclude_sources:
    - str
  # Substrings matched against mDNS packet contents.
  exclude_names:
    - str
  exclude_mode: list(advertisements|all)
  reflect_ipv6: bool
  reflect_between_ipv4_ipv6: bool
  # Leave false so Avahi coexists with Home Assistant's own mDNS stack on :5353.
  disallow_other_stacks: bool
  allow_point_to_point: bool
  log_level: list(debug|info|notice|warn|error|fatal)
