---
# https://developers.home-assistant.io/docs/add-ons/configuration#add-on-config
name: mDNS Reflector
version: "1.2.1"
slug: mdns_reflector
description: >-
  Reflect or proxy mDNS/Bonjour between VLAN interfaces, so AirPrint,
  AirPlay and HomeKit discovery work across network segments.
url: "https://github.com/jeanders/ha-mdns-reflector/tree/main/mdns-reflector"
# Prebuilt multi-arch images, published by .github/workflows/release.yaml when
# a GitHub release is published. The release build reads this value to know
# where to push, so it must be set before tagging.
image: "ghcr.io/jeanders/mdns-reflector"
arch:
  - aarch64
  - amd64
init: false
startup: services

# The reflector must see the host's real VLAN interfaces (end0, end0.20,
# end0.30) rather than a private container network.
host_network: true
privileged:
  - NET_ADMIN
  - NET_RAW

options:
  # reflector - relay multicast between VLANs with Avahi (the original mode).
  # proxy     - learn services on proxy_sources and answer for them on
  #             proxy_targets, like a switch's service-discovery gateway. Use
  #             this when your Wi-Fi never delivers multicast to clients.
  mode: reflector
  interfaces:
    - end0
    - end0.20
    - end0.30
  # Empty = reflect every service type. The default below covers the common
  # cross-VLAN cases, including AirPlay.
  #
  # It still omits Apple's peer-to-peer and identity services (_companion-link,
  # _rdlink, _device-info, _sleep-proxy), which carry no discovery value across
  # VLANs and are a conflict source for machines sitting on two reflected VLANs
  # at once. AirPlay is a conflict source too, but it is usually the reason
  # people run a reflector, so it stays in: pair it with exclude_sources for any
  # dual-homed machine. See DOCS.md.
  #
  # Avahi never reflects the host's own announcements (see
  # originates_from_local_iface in avahi-core/server.c), so Home Assistant's and
  # Scrypted's own services are excluded automatically.
  # Empty = reflect every service type.
  #
  # KEEP THIS LIST SHORT. Avahi's config parser reads lines into a 128-byte
  # buffer (char ln[128] in avahi-daemon/main.c), and the generated
  # "reflect-filters=" line must fit. Matching is a substring test, so short
  # stems cover several types at once: "_hap." covers _hap._tcp.local and
  # _hap._udp.local, "_matter" covers _matter._tcp and _matterc._udp.
  #
  # Apple's peer-to-peer and identity services (_companion-link, _rdlink,
  # _device-info, _sleep-proxy) are deliberately absent: they are a conflict
  # source for machines sitting on two reflected VLANs at once. See DOCS.md.
  #
  # Avahi never reflects the host's own announcements (see
  # originates_from_local_iface in avahi-core/server.c), so Home Assistant's and
  # Scrypted's own services are excluded automatically.
  reflect_filters:
    - _hap.
    - _airplay.
    - _raop.
    - _matter
    - _googlecast.
    - _printer.
    - _ipp
  # Hosts whose mDNS is dropped before Avahi sees it, by source IP. Use this for
  # a machine that is on two reflected VLANs at once (a docked laptop on wired
  # VLAN A and Wi-Fi VLAN B): list BOTH of its addresses. See DOCS.md - this
  # installs firewall rules on the host.
  exclude_sources: []
  # Substrings matched against the raw mDNS packet, for excluding hosts by name
  # rather than by address - useful when DHCP moves them around. Fixed strings,
  # not regular expressions: the kernel's string match has no regex support.
  # Empty by default deliberately; see DOCS.md for why "MacBook" is not a safe
  # default.
  exclude_names: []
  # What to drop for those hosts:
  #   advertisements - only their mDNS responses, so they still cannot be
  #                    reflected, but their queries still cross and they keep
  #                    discovering everything else (needed to AirPlay OUT).
  #   all            - every mDNS packet from them, including queries.
  exclude_mode: advertisements
  reflect_ipv6: false
  reflect_between_ipv4_ipv6: false
  disallow_other_stacks: false
  allow_point_to_point: false
  log_level: info
  # Proxy mode only. Learn on these interfaces...
  proxy_sources:
    - end0
  # ...and publish on these. The two lists must not overlap.
  proxy_targets:
    - end0.20
  # Service types to learn and republish, written the way dns-sd writes them:
  # a type, then any subtypes after commas. AirPrint on iPhone and iPad browses
  # the _universal subtype of _ipp/_ipps, so printers need it.
  #
  # Deliberately absent: _device-info and _sleep-proxy (host plumbing, not
  # services), Thread border-router infrastructure (_meshcop, _trel, _srpl-tls),
  # _matter and _hap._udp (IPv6-only here; the proxy is IPv4), and _smb/_adisk
  # (Time Machine works better pointed at by address). See DOCS.md.
  proxy_services:
    - _ipp._tcp,_universal
    - _ipps._tcp,_universal
    - _printer._tcp
    - _pdl-datastream._tcp
    - _uscan._tcp
    - _uscans._tcp
    - _airplay._tcp
    - _raop._tcp
    - _companion-link._tcp
    - _hap._tcp
    - _googlecast._tcp
    - _spotify-connect._tcp
  # Subtypes to learn and republish for EVERY service above, on top of the
  # per-service ones. Usually empty.
  proxy_subtypes: []
  # Devices whose model (from the TXT keys model, am or rpMd) starts with one
  # of these are never proxied. Laptops, phones and tablets move between
  # VLANs; a copy of their records left on another VLAN makes them see their
  # own name taken and rename themselves. Empty list = proxy everything.
  proxy_skip_models:
    - Mac
    - iMac
    - iPhone
    - iPad
    - iPod

schema:
  mode: list(reflector|proxy)
  # Host interfaces to reflect between. At least two, or there is nothing to do.
  interfaces:
    - str
  # Service types allowed to cross. Empty list = reflect everything.
  reflect_filters:
    - str
  # Source IPs whose mDNS never reaches the reflector.
  exclude_sources:
    - str
  # Substrings matched against mDNS packet contents.
  exclude_names:
    - str
  exclude_mode: list(advertisements|all)
  reflect_ipv6: bool
  reflect_between_ipv4_ipv6: bool
  # Leave false so Avahi coexists with Home Assistant's own mDNS stack on :5353.
  disallow_other_stacks: bool
  allow_point_to_point: bool
  log_level: list(debug|info|notice|warn|error|fatal)
  proxy_sources:
    - str
  proxy_targets:
    - str
  proxy_services:
    - str
  proxy_subtypes:
    - str
  proxy_skip_models:
    - str
