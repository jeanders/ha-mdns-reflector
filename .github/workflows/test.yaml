name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  proxy-logic:
    name: Proxy mode logic
    runs-on: ubuntu-latest
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@v7.0.1

      - name: Install python-zeroconf (the version the image pins)
        run: |
          version=$(sed -n 's/^ARG ZEROCONF_VERSION=//p' mdns-reflector/Dockerfile)
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install "zeroconf==${version}"

      - name: Run unit tests
        run: '"$RUNNER_TEMP/venv/bin/python" -m unittest discover -s tests -v'

  shell:
    name: Shell syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@v7.0.1

      - name: bash -n on the s6 service scripts
        run: |
          for f in mdns-reflector/rootfs/etc/services.d/*/run mdns-reflector/rootfs/etc/services.d/*/finish; do
            bash -n "$f" && echo "ok  $f"
          done
